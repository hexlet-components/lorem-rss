# GITHUB_TOKEN берётся из окружения и снимает лимит запросов github.com.
max_concurrency = 8
max_retries = 3
retry_wait_time = 5
timeout = 30
cache = true
max_cache_age = "1d"
accept = ["200..=204", "429"]
exclude_path = ["LICENSE", "node_modules", "vendor", "CHANGELOG.md"]
# npmjs.com отвечает CI кодом 403 (защита от ботов), в браузере ссылки живые.
# Пример с interval=7 в README намеренно неверный и отвечает 500; stackoverflow отвечает CI кодом 403.
exclude = ["^https://www.npmjs.com/", "^https?://localhost", "^https?://127\\.0\\.0\\.1", "^http://lorem-rss.herokuapp.com/feed\\?unit=minute&interval=7", "^https?://stackoverflow.com/"]
